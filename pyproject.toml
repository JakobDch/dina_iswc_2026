[project]
name = "dina-agent-experiment"
version = "0.1.0"
description = "Agentic Text-to-SPARQL experiment for ISWC 2026"
authors = [{ name = "Jakob", email = "jakob@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LangChain / LangGraph
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-community>=0.3.0",

    # LLM Providers
    "openai>=1.50.0",
    "anthropic>=0.39.0",

    # Embeddings & Scientific Computing
    "faiss-cpu>=1.8.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",  # For Hungarian algorithm (linear_sum_assignment)

    # Data handling
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # HTTP client
    "httpx>=0.27.0",
    "aiohttp>=3.10.0",

    # RDF / SPARQL
    "rdflib>=7.0.0",
    "SPARQLWrapper>=2.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",

    # Data export
    "pandas>=2.2.0",

    # Docker & Database (for Mapping Optimizer)
    "docker>=7.0.0",
    "mysql-connector-python>=8.0.0",

    # SQL parsing (for Mapping Optimizer SQL analysis)
    "sqlglot>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
