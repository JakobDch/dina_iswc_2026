# Slot-based OnTop containers with per-slot mapping isolation (SMALL datasets only)
# 5 slots x 5 containers = 25 containers
# Ports: Slot0=8100-8105, Slot1=8200-8205, Slot2=8300-8305, Slot3=8400-8405, Slot4=8500-8505
# (port index 4 is skipped – previously used for BGEE which is not part of the experiment)
#
# Container naming convention (must match code in mapping_optimizer_tools.py):
#   Small:   ontop_{dataset}_small_slot{N}  (edu, trn, nrg)
#   Unsized: ontop_{dataset}_slot{N}        (bsbm, lca)
#
# LARGE containers were removed (mapping optimization moved to a separate paper).
# BGEE was removed (not part of the experimental corpus, database not provisioned).
#
# Each slot mounts from mappings-slots/slot{N}/{dataset}/ for mapping isolation.
# Initialize with: python scripts/initialize_slot_mappings.py --slots 5 --clean

x-ontop-base: &ontop-base
  build:
    context: .
    dockerfile: Dockerfile.ontop
  restart: "no"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 120s
  networks:
    - experiment_network

x-ontop-small: &ontop-small
  <<: *ontop-base
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1G
  environment: &env-small
    JAVA_TOOL_OPTIONS: "-Xmx768m -Xms512m"

services:
  # ========== SLOT 0 (8100-8105) ==========
  ontop-edu-small-slot0:
    <<: *ontop-small
    container_name: ontop_edu_small_slot0
    ports: ["8100:8080"]
    volumes: ["./mappings-slots/slot0/edu-small:/opt/ontop/input"]
    environment:
      <<: *env-small
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology.owl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
    command: ["ontop", "endpoint", "--portal=/opt/ontop/input/portal.toml", "--dev"]

  ontop-trn-small-slot0:
