# =============================================================================
# Docker Compose for Slot-Based Container Isolation
# =============================================================================
#
# This configuration provides isolated OnTop containers per concurrency slot,
# allowing the Mapping Optimizer to modify mappings without affecting other
# concurrent queries.
#
# Port allocation per slot:
#   Slot 0: 8100-8109 (edu=8100, trn=8101, nrg=8102, bsbm=8103, bgee=8104, lca=8105)
#   Slot 1: 8200-8209
#   Slot 2: 8300-8309
#   (Slot 3 removed to reduce resource usage)
#
# Prerequisites:
#   1. Run: python scripts/initialize_slot_mappings.py --slots 3
#   2. Ensure mysql container is running (from docker-compose.yml)
#
# Usage:
#   docker compose -f docker-compose.slots.yml up -d
#
# =============================================================================

# ============================================================
# YAML Anchors for shared OnTop configuration
# ============================================================
x-ontop-base: &ontop-base
  build:
    context: .
    dockerfile: Dockerfile.ontop
  restart: "no"  # Changed from unless-stopped to prevent auto-start on Docker restart
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
    interval: 10s
    timeout: 10s
    retries: 30
    start_period: 120s
  networks:
    - dina_network

x-ontop-small: &ontop-small
  <<: *ontop-base
  deploy:
    resources:
      limits:
        cpus: '2.0'
        memory: 1G
  environment: &env-small
    JAVA_TOOL_OPTIONS: "-Xmx768m -Xms512m"
    ONTOP_DEV_MODE: "true"

x-ontop-large: &ontop-large
  <<: *ontop-base
  deploy:
    resources:
      limits:
        cpus: '4.0'
        memory: 8G
  environment: &env-large
    JAVA_TOOL_OPTIONS: "-Xmx6g -XX:+UseG1GC"
    ONTOP_DEV_MODE: "true"

services:
  # ============================================================
  # SLOT 0 - Ports 8100-8109
  # ============================================================

  ontop-edu-small-slot0:
    <<: *ontop-small
    container_name: dina_ontop_edu_small_slot0
    ports:
      - "8100:8080"
    volumes:
      - ./mappings-slots/slot0/edu-small:/opt/ontop/input
    environment:
      <<: *env-small
      ONTOP_MAPPING_FILE: /opt/ontop/input/mapping.ttl
      ONTOP_ONTOLOGY_FILE: /opt/ontop/input/ontology.owl
      ONTOP_PROPERTIES_FILE: /opt/ontop/input/ontop.properties
    command: ["ontop", "endpoint", "--portal=/opt/ontop/input/portal.toml", "--dev"]

