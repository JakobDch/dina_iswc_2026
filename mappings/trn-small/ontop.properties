# TRN Small Dataset (Metro only, ~2k StopTimes)
# JDBC Connection with timeouts
jdbc.url=jdbc:mysql://mysql:3306/gtfs_small?allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&socketTimeout=120000
jdbc.user=root
jdbc.password=root
jdbc.driver=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
jdbc.pool.maxSize=5
jdbc.pool.minIdle=1
jdbc.pool.connectionTimeout=30000
jdbc.pool.idleTimeout=60000
jdbc.pool.maxLifetime=300000
