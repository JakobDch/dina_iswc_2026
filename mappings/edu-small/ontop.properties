# EDU Small Dataset (100 Universities, ~100k triples)
# JDBC Connection with timeouts
jdbc.url=jdbc:mysql://mysql:3306/lubm_small?allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=10000&socketTimeout=15000
jdbc.user=root
jdbc.password=root
jdbc.driver=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings
jdbc.pool.maxSize=5
jdbc.pool.minIdle=1
jdbc.pool.connectionTimeout=30000
jdbc.pool.idleTimeout=60000
jdbc.pool.maxLifetime=300000
